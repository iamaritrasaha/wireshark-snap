name: Build and test Wireshark Snap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SNAP_ARTIFACT: wireshark-snap-${{ github.sha }}

jobs:
  validate:
    name: Validate packaging metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse and inspect snapcraft.yaml
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"

          data = YAML.load_file("snap/snapcraft.yaml")
          raise "wrong snap name" unless data.fetch("name") == "wireshark"
          raise "wrong base" unless data.fetch("base") == "core24"
          raise "strict confinement is required" unless data.fetch("confinement") == "strict"
          raise "source must be an archive" unless data.dig("parts", "wireshark", "source-type") == "tar"
          checksum = data.dig("parts", "wireshark", "source-checksum")
          expected = "sha256/c0f1ccf217bc0d3b51a9c03ea178b0f7df682e475da26a2d21cd4a1bdd9579d0"
          raise "source checksum is not pinned" unless checksum == expected
          raise "official Qt integration is missing" unless data.fetch("extensions").include?("kde-neon-6")
          %w[wireshark tshark dumpcap capinfos editcap mergecap text2pcap reordercap].each do |app|
            raise "missing app #{app}" unless data.fetch("apps").key?(app)
          end
          forbidden = data.fetch("apps").values.flat_map { |app| Array(app["plugs"]) }
          raise "broad capture interface added without evidence" if forbidden.include?("network-control")
          raise "classic confinement is forbidden" if data.fetch("confinement") == "classic"
          puts "snapcraft metadata checks passed"
          RUBY
          test ! -e parts
          test ! -e prime
          test ! -e stage
          git diff --check

      - name: Verify deterministic test fixture generator
        run: python3 tests/generate_pcapng.py "$RUNNER_TEMP/minimal.pcapng"

  build:
    name: Build Snap
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with Snapcraft
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Record artifact metadata
        shell: bash
        env:
          SNAP_FILE: ${{ steps.snapcraft.outputs.snap }}
        run: |
          set -euo pipefail
          test -f "$SNAP_FILE"
          {
            printf 'filename=%s\n' "$(basename "$SNAP_FILE")"
            printf 'size_bytes=%s\n' "$(stat -c %s "$SNAP_FILE")"
            printf 'sha256='
            sha256sum "$SNAP_FILE" | awk '{print $1}'
          } | tee snap-build-metadata.txt
          echo "Built $SNAP_FILE"

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SNAP_ARTIFACT }}
          path: |
            ${{ steps.snapcraft.outputs.snap }}
            snap-build-metadata.txt
          if-no-files-found: error
          retention-days: 14

  install:
    name: Install exact artifact on fresh runner
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SNAP_ARTIFACT }}
          path: artifact

      - name: Install and inspect Snap
        shell: bash
        run: |
          set -euo pipefail
          SNAP_FILE="$(find artifact -maxdepth 1 -type f -name '*.snap' -print -quit)"
          test -n "$SNAP_FILE"
          sha256sum "$SNAP_FILE"
          sudo snap install "$SNAP_FILE" --dangerous
          snap list wireshark
          snap connections wireshark | tee "$RUNNER_TEMP/install-connections.txt"
          test "$(snap list wireshark | awk 'NR == 2 {print $1}')" = wireshark
          sudo snap remove wireshark

  smoke:
    name: Smoke test installed Snap
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download exact build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SNAP_ARTIFACT }}
          path: artifact

      - name: Install exact artifact
        shell: bash
        run: |
          set -euo pipefail
          SNAP_FILE="$(find artifact -maxdepth 1 -type f -name '*.snap' -print -quit)"
          test -n "$SNAP_FILE"
          sha256sum "$SNAP_FILE" | tee "$RUNNER_TEMP/smoke-artifact-sha256.txt"
          sudo snap install "$SNAP_FILE" --dangerous

      - name: Verify installed layout, versions, metadata, and utilities
        shell: bash
        run: |
          set -euo pipefail
          SNAP_ROOT="$(readlink -f /snap/wireshark/current)"
          snap list wireshark | tee "$RUNNER_TEMP/snap-list.txt"
          snap connections wireshark | tee "$RUNNER_TEMP/snap-connections.txt"
          for tool in wireshark tshark dumpcap capinfos editcap mergecap text2pcap reordercap; do
            test -x "$SNAP_ROOT/usr/bin/$tool"
            "$tool" --version | tee "$RUNNER_TEMP/$tool-version.txt"
          done
          test -f "$SNAP_ROOT/usr/share/applications/org.wireshark.Wireshark.desktop"
          grep -E '^Exec=wireshark %F$' "$SNAP_ROOT/usr/share/applications/org.wireshark.Wireshark.desktop"
          grep -E '^MimeType=.*application/vnd.tcpdump.pcap' "$SNAP_ROOT/usr/share/applications/org.wireshark.Wireshark.desktop"
          test -x "$SNAP_ROOT/usr/lib/x86_64-linux-gnu/wireshark/plugins/4.6.8/epan/ethercat.so" || \
            find "$SNAP_ROOT/usr/lib" -path '*/wireshark/plugins/*' -type f -print -quit | grep .
          find "$SNAP_ROOT/usr/lib" -path '*/wireshark/extcap/*' -type f -print -quit | grep .

      - name: Parse deterministic pcapng fixture
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/minimal.pcapng"
          python3 tests/generate_pcapng.py "$FIXTURE"
          capinfos "$FIXTURE" | tee "$RUNNER_TEMP/capinfos.txt"
          test "$(tshark -r "$FIXTURE" -T fields -e frame.number -e ip.src -e udp.dstport)" = $'1\t192.0.2.1\t53'
          tshark -G protocols | grep -E '^eth[[:space:]]|^ip[[:space:]]|^udp[[:space:]]'
          editcap "$FIXTURE" "$RUNNER_TEMP/edited.pcapng"
          mergecap -w "$RUNNER_TEMP/merged.pcapng" "$FIXTURE" "$FIXTURE"
          reordercap "$FIXTURE" "$RUNNER_TEMP/reordered.pcapng"
          printf '000000 00 11 22 33 44 55 66 77 88 99 aa bb 08 00\n' | \
            text2pcap -l 1 - "$RUNNER_TEMP/text2pcap.pcap"
          capinfos "$RUNNER_TEMP/text2pcap.pcap" | grep -E 'File type|Number of packets'

      - name: Exercise GUI startup under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y xvfb
          }
          set +e
          timeout --signal=TERM 12s xvfb-run -a env HOME="$RUNNER_TEMP/gui-home" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/gui-config" wireshark --no-splash \
            >"$RUNNER_TEMP/wireshark-gui.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/wireshark-gui.log"
          case "$status" in
            0|124|143) ;;
            *) echo "Wireshark GUI exited during startup with status $status" >&2; exit "$status" ;;
          esac

      - name: Test interface enumeration and bounded loopback capture
        shell: bash
        run: |
          set -euo pipefail
          set +e
          dumpcap -D >"$RUNNER_TEMP/dumpcap-interfaces.txt" 2>&1
          dumpcap_status=$?
          tshark -D >"$RUNNER_TEMP/tshark-interfaces.txt" 2>&1
          tshark_status=$?
          set -e
          cat "$RUNNER_TEMP/dumpcap-interfaces.txt"
          cat "$RUNNER_TEMP/tshark-interfaces.txt"
          {
            echo "dumpcap_interface_status=$dumpcap_status"
            echo "tshark_interface_status=$tshark_status"
          } | tee "$RUNNER_TEMP/interface-status.txt"

          if [ "$dumpcap_status" -eq 0 ] && grep -Eq '(^|[.] )[[:space:]]*lo([[:space:]]|$)' "$RUNNER_TEMP/dumpcap-interfaces.txt"; then
            set +e
            timeout 6s dumpcap -i lo -c 1 -w "$RUNNER_TEMP/loopback.pcapng" \
              >"$RUNNER_TEMP/live-capture.log" 2>&1 &
            capture_pid=$!
            sleep 1
            python3 -c 'import socket; s=socket.socket(); s.settimeout(1); s.connect_ex(("127.0.0.1", 9)); s.close()'
            wait "$capture_pid"
            capture_status=$?
            set -e
            cat "$RUNNER_TEMP/live-capture.log"
            echo "loopback_capture_status=$capture_status" | tee -a "$RUNNER_TEMP/interface-status.txt"
            if [ "$capture_status" -eq 0 ] && [ -s "$RUNNER_TEMP/loopback.pcapng" ]; then
              capinfos "$RUNNER_TEMP/loopback.pcapng"
              echo "live_capture=passed" | tee -a "$RUNNER_TEMP/interface-status.txt"
            else
              echo "live_capture=not-proven-in-strict-ci" | tee -a "$RUNNER_TEMP/interface-status.txt"
              echo "::warning::Strict live capture was not proven on this GitHub-hosted runner."
            fi
          else
            echo "live_capture=not-proven-in-strict-ci" | tee -a "$RUNNER_TEMP/interface-status.txt"
            echo "::warning::Interface enumeration was unavailable in strict CI; no capture privilege was added."
          fi

      - name: Inspect AppArmor observations
        if: always()
        shell: bash
        run: |
          set +e
          sudo journalctl -k --no-pager -b | grep -iE 'apparmor=.*(wireshark|tshark|dumpcap)|audit:.*(wireshark|tshark|dumpcap)' \
            | tee "$RUNNER_TEMP/apparmor-observations.txt"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "No matching AppArmor denial was emitted by the runner kernel." | tee "$RUNNER_TEMP/apparmor-observations.txt"
          fi

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wireshark-smoke-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove installed Snap
        if: always()
        run: sudo snap remove wireshark || true

  cleanup:
    name: Cleanup stage
    if: always()
    needs: [build, install, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm disposable-runner cleanup boundary
        run: |
          echo "Build, installation, and smoke-test work ran on disposable GitHub-hosted runners."
          echo "No Snap artifact is committed or published by this workflow."
