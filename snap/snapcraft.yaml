  reordercap:
    command: usr/bin/reordercap
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib:$SNAP/lib/x86_64-linux-gnu:$SNAP/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
      PATH: $SNAP/usr/bin:$SNAP/usr/sbin${PATH:+:$PATH}
      WIRESHARK_DATA_DIR: $SNAP/usr/share/wireshark
      WIRESHARK_PLUGIN_DIR: $SNAP/usr/lib/x86_64-linux-gnu/wireshark/plugins
      WIRESHARK_EXTCAP_DIR: $SNAP/usr/libexec/wireshark/extcap
